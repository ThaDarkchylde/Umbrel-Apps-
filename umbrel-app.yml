manifestVersion: 1
id: kaspa-stratum-bridge
category: networking
name: Kaspa Stratum Bridge
version: "1.0.0"
tagline: Stratum-Bridge für Solo-Mining an deinem eigenen Rusty-Kaspad-Node
description: >-
  Startet ausschließlich die aktuelle Kaspa-Stratum-Bridge
  (onemorebsmith/kaspa-stratum-bridge) und verbindet sie mit deinem bereits
  laufenden Rusty-Kaspad-Node. Kein eigener Node, keine zusätzliche
  Blockchain-Synchronisation – nur der Adapter, der Stratum-fähigen ASICs
  (z. B. IceRiver KS0 Ultra) erlaubt, direkt gegen deinen Node solo zu minen.
  Der Bridge-Port wird sowohl auf 5555 als auch auf 5001 exponiert, damit du
  ihn unabhängig von der Firmware-Konvention deines Miners eintragen kannst.
developer: community
website: https://github.com/onemorebsmith/kaspa-stratum-bridge
dependencies:
  - rusty-kaspad
repo: https://github.com/onemorebsmith/kaspa-stratum-bridge
support: https://github.com/onemorebsmith/kaspa-stratum-bridge/issues
port: 5555
gallery: []
releaseNotes: >-
  Erste Version: reine Stratum-Bridge ohne eigenen Node, verbindet sich mit
  der offiziellen Rusty-Kaspad-App (v2.0.1) aus dem Umbrel App Store.
